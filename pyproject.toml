[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verisight"
version = "1.0.0"
description = "AI-Powered Multi-Agent RTL/UVM Debugging Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VeriSight Team"},
]

dependencies = [
    "pydantic>=2.0",
    "chromadb>=0.5",
    "google-generativeai>=0.8",
    "jinja2>=3.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
verisight = "verisight.main:main"

[tool.setuptools.packages.find]
include = ["verisight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
